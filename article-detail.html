<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="百鲸咨询 - 精选专业文章">
  <meta property="og:title" content="文章详情 - 百鲸咨询">
  <meta property="og:description" content="百鲸咨询 - 精选专业文章">
  <meta property="og:type" content="article">
  <meta property="og:url" content="https://baijingzixun.top/article-detail.html">
  <meta property="og:image" content="https://baijingzixun.top/home-banner.png">
  <meta property="og:site_name" content="百鲸咨询">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="文章详情 - 百鲸咨询">
  <meta name="twitter:description" content="百鲸咨询 - 精选专业文章">
  <link rel="canonical" href="https://baijingzixun.top/article-detail.html">
  <link rel="icon" href="logo0（透明）.png">
  <title>文章详情 - 百鲸咨询</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    tailwind.config = { theme: { extend: {
      colors: { primary:'#083E78', accent:'#28B8A0', hover:'#22C0E0', section:'#F4FAFF', neutral:'#E2E8F0', secondary:'#333333' },
      fontFamily: { sans: ['Noto Sans SC','system-ui','sans-serif'] },
      boxShadow: { elevated: '0 10px 25px -5px rgba(0,0,0,.05), 0 8px 10px -6px rgba(0,0,0,.08)' }
    } } };
  </script>
  <style>
    body { font-family:'Noto Sans SC',sans-serif; color:#333; background:linear-gradient(180deg,#FAFBFD 0%,#F4FAFF 100%); }
    .prose img { max-width:100%; height:auto; border-radius:8px; margin:1rem 0; }
    .prose h2 { font-size:1.4rem; font-weight:700; margin:1.4rem 0 .6rem; color:#083E78; }
    .prose h3 { font-size:1.15rem; font-weight:700; margin:1.1rem 0 .5rem; color:#083E78; }
    .prose p { line-height:1.9; margin:.7rem 0; }
    .prose ul, .prose ol { margin:.6rem 0 1rem 1.4rem; }
    .prose li { margin:.35rem 0; line-height:1.85; }
    .prose a { color:#28B8A0; text-decoration:underline; font-weight:500; }
    .prose a:hover { color:#22C0E0; }
    .prose table { width:100%; border-collapse:collapse; margin:1rem 0; font-size:15px; }
    .prose th, .prose td { border:1px solid #E2E8F0; padding:8px 12px; text-align:left; }
    .prose th { background:#F4FAFF; color:#083E78; font-weight:600; }
    .prose blockquote { border-left:4px solid #28B8A0; background:#F4FAFF; padding:12px 16px; margin:1rem 0; color:#555; border-radius:0 8px 8px 0; }
    .prose blockquote p { margin:.3rem 0; }
    .prose hr { border:none; border-top:1px solid #E2E8F0; margin:1.6rem 0; }
    .btn-secondary {
      display:inline-flex; align-items:center; justify-content:center; gap:6px;
      padding:8px 16px; border-radius:8px; font-weight:600; font-size:14px;
      color:#083E78; background:#fff; border:1px solid #E2E8F0;
      transition:all .3s ease; text-decoration:none; white-space:nowrap;
    }
    .btn-secondary:hover { color:#fff; background:#083E78; border-color:#083E78; }
  </style>
  <link rel="stylesheet" href="premium-enhance.css">
</head>
<body>
  <header class="sticky top-0 z-50 bg-white shadow-sm border-b border-neutral/20">
    <div class="container mx-auto px-4 sm:px-6 lg:px-8 py-4 flex items-center justify-between">
      <a href="index.html" class="flex items-center">
        <img src="logo0（透明）.png" style="width:25vw;max-width:140px;min-width:80px;height:auto;object-fit:contain;" alt="百鲸咨询logo">
      </a>
      <a href="index.html" class="btn-secondary text-sm"><i class="fas fa-arrow-left mr-1"></i> 返回首页</a>
    </div>
  </header>

  <main class="container mx-auto px-4 sm:px-6 lg:px-8 py-12">
    <article id="articleBox" class="max-w-4xl mx-auto bg-white rounded-2xl shadow-elevated border border-neutral/20 p-6 sm:p-8 md:p-10 reveal card-gold-hover">
      <div class="text-center text-secondary/50 py-12"><i class="fas fa-spinner fa-spin text-2xl mb-3"></i><p>加载中...</p></div>
    </article>
  </main>

  <script>
    const SUPABASE_URL = 'https://mxtxwjprmfstbheiempi.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_2VAasjGlB4ioG-hhCMSnAA_4AdPGD-R';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    function formatDate(s){ if(!s) return ''; const d=new Date(s); const p=n=>String(n).padStart(2,'0'); return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`; }
    function escapeHtml(str){ if(!str) return ''; const d=document.createElement('div'); d.textContent=str; return d.innerHTML; }

    (async () => {
      const id = new URLSearchParams(location.search).get('id');
      const box = document.getElementById('articleBox');
      if (!id) { box.innerHTML = '<p class="text-center text-secondary/60 py-12">文章不存在</p>'; return; }
      const { data, error } = await supabaseClient.from('articles').select('*').eq('id', id).single();
      if (error || !data) { box.innerHTML = '<p class="text-center text-secondary/60 py-12">文章不存在或已被删除</p>'; return; }
      document.title = data.title + ' - 百鲸咨询';
      const siteUrl = 'https://baijingzixun.top';
      const coverImg = data.cover_url ? data.cover_url : siteUrl + '/article-default-cover.svg';
      // 动态更新 meta 标签（提升 SEO）
      const updateMeta = (attr, value, content) => {
        let el = document.querySelector(`meta[${attr}="${value}"]`);
        if (!el) { el = document.createElement('meta'); el.setAttribute(attr, value); document.head.appendChild(el); }
        el.setAttribute('content', content);
      };
      updateMeta('property', 'og:title', data.title + ' - 百鲸咨询');
      updateMeta('property', 'og:description', data.excerpt || '百鲸咨询 - 精选专业文章');
      updateMeta('property', 'og:image', coverImg);
      updateMeta('property', 'og:url', siteUrl + '/article-detail.html?id=' + id);
      updateMeta('name', 'description', data.excerpt || '百鲸咨询 - 精选专业文章');
      updateMeta('property', 'twitter:title', data.title + ' - 百鲸咨询');
      updateMeta('property', 'twitter:description', data.excerpt || '百鲸咨询 - 精选专业文章');
      updateMeta('property', 'twitter:image', coverImg);
      // 更新 canonical
      let canonical = document.querySelector('link[rel="canonical"]');
      if (canonical) canonical.setAttribute('href', siteUrl + '/article-detail.html?id=' + id);
      box.innerHTML = `
        <img src="${escapeHtml(data.cover_url || 'article-default-cover.svg')}" class="w-full rounded-xl mb-6 object-cover max-h-96" alt="${escapeHtml(data.title)}">
        <div class="flex flex-wrap items-center text-sm text-secondary/50 mb-4 gap-2">
          <span><i class="far fa-calendar-alt mr-1"></i>${formatDate(data.created_at)}</span>
          <span>·</span><span><i class="far fa-user mr-1"></i>${escapeHtml(data.author || '百鲸咨询')}</span>
          <span>·</span><span><i class="far fa-folder mr-1"></i>${escapeHtml(data.category || '咨询')}</span>
        </div>
        <h1 class="text-2xl md:text-3xl font-bold text-secondary mb-4 leading-snug">${escapeHtml(data.title)}</h1>
        ${data.excerpt ? `<p class="text-secondary/70 text-lg mb-6 border-l-4 border-accent pl-4">${escapeHtml(data.excerpt)}</p>` : ''}
        <div class="prose">${data.content || ''}</div>`;
      box.querySelectorAll('.prose a').forEach(a => { a.target = '_blank'; a.rel = 'noopener'; });
    })();
  </script>
  <script src="premium-enhance.js"></script>
</body>
</html>
