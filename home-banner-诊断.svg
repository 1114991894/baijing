<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#062451"/>
      <stop offset="45%" stop-color="#083E78"/>
      <stop offset="100%" stop-color="#0a4d92"/>
    </linearGradient>
    <radialGradient id="titleGlow" cx="32%" cy="42%" r="50%">
      <stop offset="0%" stop-color="#28B8A0" stop-opacity="0.20"/>
      <stop offset="55%" stop-color="#22C0E0" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cardGlow" cx="75%" cy="40%" r="45%">
      <stop offset="0%" stop-color="#22C0E0" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M60 0L0 0 0 60" fill="none" stroke="#22C0E0" stroke-width="0.5" stroke-opacity="0.10"/>
    </pattern>
    <linearGradient id="accentLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#28B8A0" stop-opacity="0"/>
      <stop offset="50%" stop-color="#28B8A0" stop-opacity="1"/>
      <stop offset="100%" stop-color="#28B8A0" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="leap" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#28B8A0" stop-opacity="0"/>
      <stop offset="55%" stop-color="#28B8A0" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#22C0E0" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="leap2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22C0E0" stop-opacity="0"/>
      <stop offset="55%" stop-color="#22C0E0" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#28B8A0" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="ctaGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#28B8A0"/>
      <stop offset="100%" stop-color="#22C0E0"/>
    </linearGradient>
    <linearGradient id="ctaShine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#28B8A0"/>
      <stop offset="100%" stop-color="#22C0E0"/>
    </linearGradient>
    <linearGradient id="warmGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF7A45"/>
      <stop offset="100%" stop-color="#FFB35C"/>
    </linearGradient>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&amp;display=swap');
      .ff { font-family: 'Noto Sans SC', system-ui, sans-serif; }
    </style>
  </defs>

  <!-- 背景层 -->
  <rect width="1600" height="900" fill="url(#bgGrad)"/>
  <rect width="1600" height="900" fill="url(#grid)"/>
  <rect width="1600" height="900" fill="url(#titleGlow)"/>
  <rect width="1600" height="900" fill="url(#cardGlow)"/>

  <!-- 鲸跃大弧线 -->
  <path d="M 180 860 Q 820 480, 1480 90" fill="none" stroke="url(#leap)" stroke-width="100" stroke-linecap="round" opacity="0.16"/>
  <path d="M 260 880 Q 900 520, 1540 170" fill="none" stroke="url(#leap2)" stroke-width="26" stroke-linecap="round" opacity="0.25"/>

  <!-- 装饰粒子 -->
  <g>
    <circle cx="1180" cy="120" r="2.5" fill="#28B8A0" opacity="0.7"/>
    <circle cx="1320" cy="220" r="2" fill="#22C0E0" opacity="0.6"/>
    <circle cx="1480" cy="150" r="2" fill="#28B8A0" opacity="0.7"/>
    <circle cx="1560" cy="330" r="2" fill="#22C0E0" opacity="0.5"/>
    <circle cx="1060" cy="760" r="2" fill="#22C0E0" opacity="0.5"/>
    <circle cx="1550" cy="780" r="1.5" fill="#28B8A0" opacity="0.5"/>
    <circle cx="200" cy="200" r="2" fill="#22C0E0" opacity="0.5"/>
    <circle cx="90" cy="420" r="1.5" fill="#28B8A0" opacity="0.4"/>
    <circle cx="760" cy="120" r="1" fill="#FFFFFF" opacity="0.4"/>
    <circle cx="900" cy="180" r="1.5" fill="#22C0E0" opacity="0.5"/>
  </g>

  <!-- 顶部品牌区 -->
  <g transform="translate(80, 80)">
    <line x1="0" y1="0" x2="56" y2="0" stroke="#28B8A0" stroke-width="3"/>
    <text x="0" y="42" class="ff" font-weight="700" font-size="34" fill="#FFFFFF" letter-spacing="8">百鲸咨询</text>
    <text x="0" y="74" class="ff" font-weight="500" font-size="15" fill="#28B8A0" letter-spacing="5" opacity="0.9">BAIJING · 12 YEARS FOCUS</text>
  </g>

  <!-- 右上角装饰 -->
  <g transform="translate(1520, 96)" text-anchor="end">
    <text x="0" y="0" class="ff" font-weight="500" font-size="13" fill="#FFFFFF" opacity="0.55" letter-spacing="2">2026</text>
    <line x1="-30" y1="14" x2="0" y2="14" stroke="#28B8A0" stroke-width="1" opacity="0.5"/>
    <text x="0" y="42" class="ff" font-weight="500" font-size="13" fill="#FFFFFF" opacity="0.5" letter-spacing="3">ENTERPRISE</text>
    <text x="0" y="60" class="ff" font-weight="500" font-size="13" fill="#FFFFFF" opacity="0.5" letter-spacing="3">DIAGNOSIS</text>
