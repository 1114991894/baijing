  </g>

  <!-- 痛点标签 2 行 x 3 -->
  <g transform="translate(80, 574)">
    <g transform="translate(0, 0)">
      <rect width="220" height="52" rx="26" fill="#FF8A5B" fill-opacity="0.10" stroke="#FF8A5B" stroke-width="1.2" stroke-opacity="0.45"/>
      <circle cx="42" cy="26" r="5" fill="#FF8A5B"/>
      <text x="118" y="33" text-anchor="middle" class="ff" font-weight="500" font-size="20" fill="#FFE3D5" letter-spacing="1">成本居高不下</text>
    </g>
    <g transform="translate(234, 0)">
      <rect width="220" height="52" rx="26" fill="#FF8A5B" fill-opacity="0.10" stroke="#FF8A5B" stroke-width="1.2" stroke-opacity="0.45"/>
      <circle cx="42" cy="26" r="5" fill="#FF8A5B"/>
      <text x="118" y="33" text-anchor="middle" class="ff" font-weight="500" font-size="20" fill="#FFE3D5" letter-spacing="1">团队效率低下</text>
    </g>
    <g transform="translate(468, 0)">
      <rect width="220" height="52" rx="26" fill="#FF8A5B" fill-opacity="0.10" stroke="#FF8A5B" stroke-width="1.2" stroke-opacity="0.45"/>
      <circle cx="42" cy="26" r="5" fill="#FF8A5B"/>
      <text x="118" y="33" text-anchor="middle" class="ff" font-weight="500" font-size="20" fill="#FFE3D5" letter-spacing="1">员工相互推责</text>
    </g>

    <g transform="translate(0, 66)">
      <rect width="220" height="52" rx="26" fill="#FF8A5B" fill-opacity="0.10" stroke="#FF8A5B" stroke-width="1.2" stroke-opacity="0.45"/>
      <circle cx="42" cy="26" r="5" fill="#FF8A5B"/>
      <text x="118" y="33" text-anchor="middle" class="ff" font-weight="500" font-size="20" fill="#FFE3D5" letter-spacing="1">人才流失严重</text>
    </g>
    <g transform="translate(234, 66)">
      <rect width="220" height="52" rx="26" fill="#FF8A5B" fill-opacity="0.10" stroke="#FF8A5B" stroke-width="1.2" stroke-opacity="0.45"/>
      <circle cx="42" cy="26" r="5" fill="#FF8A5B"/>
      <text x="118" y="33" text-anchor="middle" class="ff" font-weight="500" font-size="20" fill="#FFE3D5" letter-spacing="1">战略方向模糊</text>
    </g>
    <g transform="translate(468, 66)">
      <rect width="220" height="52" rx="26" fill="#FF8A5B" fill-opacity="0.10" stroke="#FF8A5B" stroke-width="1.2" stroke-opacity="0.45"/>
