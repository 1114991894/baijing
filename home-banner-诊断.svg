  <g transform="translate(1100, 140)">
    <rect width="420" height="600" rx="30" fill="#FFFFFF" fill-opacity="0.06" stroke="#22C0E0" stroke-width="1" stroke-opacity="0.28"/>

    <text x="210" y="54" text-anchor="middle" class="ff" font-weight="700" font-size="28" fill="#FFFFFF" letter-spacing="3">企业健康诊断</text>

    <!-- 环形仪表盘 -->
    <g transform="translate(210, 205)">
      <circle cx="0" cy="0" r="82" fill="none" stroke="#FFFFFF" stroke-opacity="0.10" stroke-width="18"/>
      <circle cx="0" cy="0" r="82" fill="none" stroke="url(#warmGrad)" stroke-width="18" stroke-linecap="round"
              stroke-dasharray="319.4 515.2" transform="rotate(-90)"/>
      <text x="0" y="-12" text-anchor="middle" class="ff" font-weight="900" font-size="62" fill="#FFFFFF" letter-spacing="-1">62</text>
      <text x="0" y="24" text-anchor="middle" class="ff" font-weight="500" font-size="18" fill="#FFB088" letter-spacing="2">综合健康度</text>
    </g>

    <text x="210" y="314" text-anchor="middle" class="ff" font-weight="500" font-size="15" fill="#FF8A5B" letter-spacing="1">偏低 · 存在明显短板</text>

    <line x1="36" y1="338" x2="384" y2="338" stroke="#22C0E0" stroke-width="0.6" stroke-opacity="0.25"/>

    <!-- 指标条 -->
    <g transform="translate(0, 360)">
      <g>
        <text x="36" y="20" class="ff" font-weight="500" font-size="18" fill="#FFFFFF" fill-opacity="0.85">成本控制</text>
        <rect x="150" y="6" width="192" height="14" rx="7" fill="#FFFFFF" fill-opacity="0.10"/>
        <rect x="150" y="6" width="81" height="14" rx="7" fill="#FF8A5B"/>
        <text x="366" y="20" text-anchor="end" class="ff" font-weight="700" font-size="18" fill="#FF8A5B">42</text>
      </g>
      <g transform="translate(0, 44)">
        <text x="36" y="20" class="ff" font-weight="500" font-size="18" fill="#FFFFFF" fill-opacity="0.85">团队效率</text>
        <rect x="150" y="6" width="192" height="14" rx="7" fill="#FFFFFF" fill-opacity="0.10"/>
        <rect x="150" y="6" width="106" height="14" rx="7" fill="#28B8A0"/>
        <text x="366" y="20" text-anchor="end" class="ff" font-weight="700" font-size="18" fill="#28B8A0">55</text>
      </g>
      <g transform="translate(0, 88)">
        <text x="36" y="20" class="ff" font-weight="500" font-size="18" fill="#FFFFFF" fill-opacity="0.85">责任清晰</text>
        <rect x="150" y="6" width="192" height="14" rx="7" fill="#FFFFFF" fill-opacity="0.10"/>
        <rect x="150" y="6" width="73" height="14" rx="7" fill="#FF8A5B"/>
        <text x="366" y="20" text-anchor="end" class="ff" font-weight="700" font-size="18" fill="#FF8A5B">38</text>
      </g>
      <g transform="translate(0, 132)">
        <text x="36" y="20" class="ff" font-weight="500" font-size="18" fill="#FFFFFF" fill-opacity="0.85">人才稳定</text>
        <rect x="150" y="6" width="192" height="14" rx="7" fill="#FFFFFF" fill-opacity="0.10"/>
        <rect x="150" y="6" width="92" height="14" rx="7" fill="#FF8A5B"/>
        <text x="366" y="20" text-anchor="end" class="ff" font-weight="700" font-size="18" fill="#FF8A5B">48</text>
      </g>
      <g transform="translate(0, 176)">
        <text x="36" y="20" class="ff" font-weight="500" font-size="18" fill="#FFFFFF" fill-opacity="0.85">战略聚焦</text>
        <rect x="150" y="6" width="192" height="14" rx="7" fill="#FFFFFF" fill-opacity="0.10"/>
        <rect x="150" y="6" width="115" height="14" rx="7" fill="#28B8A0"/>
        <text x="366" y="20" text-anchor="end" class="ff" font-weight="700" font-size="18" fill="#28B8A0">60</text>
      </g>
    </g>

    <g transform="translate(0, 570)">
      <text x="210" y="0" text-anchor="middle" class="ff" font-weight="400" font-size="15" fill="#FFFFFF" fill-opacity="0.5" letter-spacing="1">数据仅用于诊断 · 不会保存</text>
    </g>
  </g>

  <!-- 底部装饰线 -->
  <g transform="translate(80, 868)">
    <line x1="0" y1="0" x2="40" y2="0" stroke="#28B8A0" stroke-width="2" opacity="0.7"/>
  </g>
</svg>
