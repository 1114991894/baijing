  </g>

  <!-- 装饰线 -->
  <line x1="80" y1="556" x2="1000" y2="556" stroke="url(#accentLine)" stroke-width="1.5"/>

  <!-- 服务标签 4x2 -->
  <g transform="translate(80, 590)">
    <g transform="translate(0, 0)">
      <rect width="200" height="52" rx="26" fill="none" stroke="#22C0E0" stroke-width="1" stroke-opacity="0.45"/>
      <text x="100" y="33" text-anchor="middle" class="ff" font-weight="500" font-size="20" fill="#FFFFFF" letter-spacing="2">战略定位</text>
    </g>
    <g transform="translate(212, 0)">
      <rect width="200" height="52" rx="26" fill="none" stroke="#22C0E0" stroke-width="1" stroke-opacity="0.45"/>
      <text x="100" y="33" text-anchor="middle" class="ff" font-weight="500" font-size="20" fill="#FFFFFF" letter-spacing="2">组织优化</text>
    </g>
    <g transform="translate(424, 0)">
      <rect width="200" height="52" rx="26" fill="none" stroke="#22C0E0" stroke-width="1" stroke-opacity="0.45"/>
      <text x="100" y="33" text-anchor="middle" class="ff" font-weight="500" font-size="20" fill="#FFFFFF" letter-spacing="2">薪酬管理</text>
    </g>
    <g transform="translate(636, 0)">
      <rect width="200" height="52" rx="26" fill="none" stroke="#22C0E0" stroke-width="1" stroke-opacity="0.45"/>
      <text x="100" y="33" text-anchor="middle" class="ff" font-weight="500" font-size="20" fill="#FFFFFF" letter-spacing="2">绩效考核</text>
    </g>

    <g transform="translate(0, 68)">
      <rect width="200" height="52" rx="26" fill="none" stroke="#22C0E0" stroke-width="1" stroke-opacity="0.45"/>
      <text x="100" y="33" text-anchor="middle" class="ff" font-weight="500" font-size="20" fill="#FFFFFF" letter-spacing="2">股权激励</text>
    </g>
    <g transform="translate(212, 68)">
      <rect width="200" height="52" rx="26" fill="none" stroke="#22C0E0" stroke-width="1" stroke-opacity="0.45"/>
      <text x="100" y="33" text-anchor="middle" class="ff" font-weight="500" font-size="20" fill="#FFFFFF" letter-spacing="2">合伙模式</text>
    </g>
    <g transform="translate(424, 68)">
      <rect width="200" height="52" rx="26" fill="none" stroke="#22C0E0" stroke-width="1" stroke-opacity="0.45"/>
      <text x="100" y="33" text-anchor="middle" class="ff" font-weight="500" font-size="20" fill="#FFFFFF" letter-spacing="2">人才体系</text>
    </g>
    <g transform="translate(636, 68)">
      <rect width="200" height="52" rx="26" fill="#28B8A0" fill-opacity="0.18" stroke="#28B8A0" stroke-width="1.4"/>
      <text x="100" y="33" text-anchor="middle" class="ff" font-weight="500" font-size="20" fill="#28B8A0" letter-spacing="1.5">AI 数字化</text>
    </g>
  </g>

  <!-- CTA 按钮 -->
  <g transform="translate(80, 776)">
    <rect width="240" height="62" rx="31" fill="url(#ctaGrad)"/>
    <text x="120" y="41" text-anchor="middle" class="ff" font-weight="700" font-size="24" fill="#062451" letter-spacing="2">了解详情  →</text>
  </g>

  <!-- 网站域名（CTA 右侧） -->
  <g transform="translate(360, 815)">
    <text x="0" y="0" class="ff" font-weight="500" font-size="15" fill="#FFFFFF" opacity="0.5" letter-spacing="3">BAIJINGZIXUN.TOP</text>
  </g>

  <!-- 右侧数据区：竖排三组 -->
  <g transform="translate(1140, 0)">
    <line x1="0" y1="230" x2="0" y2="680" stroke="#FFFFFF" stroke-width="0.5" stroke-opacity="0.18"/>

    <g transform="translate(50, 290)">
      <text x="0" y="0" class="ff" font-weight="900" font-size="66" fill="#28B8A0" letter-spacing="-1">1000+</text>
      <text x="0" y="36" class="ff" font-weight="500" font-size="17" fill="#FFFFFF" opacity="0.65" letter-spacing="4">服务企业</text>
    </g>

    <g transform="translate(50, 445)">
      <text x="0" y="0" class="ff" font-weight="900" font-size="66" fill="#22C0E0" letter-spacing="-1">12年</text>
      <text x="0" y="36" class="ff" font-weight="500" font-size="17" fill="#FFFFFF" opacity="0.65" letter-spacing="4">行业深耕</text>
    </g>

    <g transform="translate(50, 600)">
      <text x="0" y="0" class="ff" font-weight="900" font-size="66" fill="#28B8A0" letter-spacing="-1">30%+</text>
      <text x="0" y="36" class="ff" font-weight="500" font-size="17" fill="#FFFFFF" opacity="0.65" letter-spacing="4">利润增长</text>
    </g>
  </g>

  <!-- 底部装饰线 -->
  <g transform="translate(80, 868)">
    <line x1="0" y1="0" x2="40" y2="0" stroke="#28B8A0" stroke-width="2" opacity="0.7"/>
  </g>
</svg>
